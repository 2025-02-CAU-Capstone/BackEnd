spring:
  config:
    import: optional:classpath:application-secret.properties
  datasource:
    url: jdbc:postgresql://database-1.ch0222kkis68.ap-northeast-2.rds.amazonaws.com/capstone
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  jackson:
    time-zone: Asia/Seoul

  jpa:
    hibernate:
      ddl-auto: update   # create / update / none 중 선택
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
  tomcat:
    max-swallow-size: 500MB

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls:
      - name: default
        url: https://13-209-30-220.nip.io/v3/api-docs

ai-server:
  base-url: ${FASTAPI_AI_BASEURL}