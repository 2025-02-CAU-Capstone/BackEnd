name: Deploy to EC2

on:
  push:
    branches: [ "develop" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execution permission for Gradle
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # --- Upload JAR to EC2 ---
      - name: Upload JAR using rsync
        uses: burnett01/rsync-deployments@5.2.2
        with:
          switches: -avzr --delete
          path: build/libs/*SNAPSHOT.jar
          remote_path: /home/ubuntu/app/          # <-- 반드시 디렉토리!
          remote_user: ubuntu
          remote_host: ${{ secrets.HOST }}
          remote_key: ${{ secrets.SSH_KEY }}

      # --- Restart service ---
      - name: Restart EC2 service
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mv /home/ubuntu/app/*SNAPSHOT.jar /home/ubuntu/app/app.jar
            sudo systemctl daemon-reload
            sudo systemctl restart p2l
            sudo systemctl status p2l --no-pager
