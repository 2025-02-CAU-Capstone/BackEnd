name: Deploy to EC2

on:
  push:
    branches: [ "develop" ]   # develop 브랜치에 push될 때 배포 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execution permission for Gradle
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # ↓↓↓ JAR 파일을 EC2로 업로드 ↓↓↓
      - name: Upload JAR to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "build/libs/*SNAPSHOT.jar"
          target: "/home/ubuntu/app/app.jar"
          overwrite: true

      # ↓↓↓ EC2에서 서비스 재시작 ↓↓↓
      - name: Restart EC2 service
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo systemctl daemon-reload
            sudo systemctl restart p2l
            sudo systemctl status p2l --no-pager
